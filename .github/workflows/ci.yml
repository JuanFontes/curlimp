name: Build and package runtime
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'website/**'
      - 'README.md'
      - 'docker/README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - '.github/release-notes/**'
      - '.gitignore'
      - '.github/workflows/pages.yml'
      - 'scripts/published_release.py'
      - 'tests/published_release.py'
      - 'SECURITY.md'
      - '.github/dependabot.yml'
      - '.github/workflows/dependency-review.yml'
      - '.github/workflows/dependency-report.yml'
      - 'scripts/dependency_report.py'
      - 'tests/dependency_report.py'
      - '.github/requirements.txt'
      - '.prettierrc.json'
      - '.prettierignore'
      - 'ruff.toml'
      - '.shellcheckrc'
      - 'scripts/check-quality.py'
      - '.github/workflows/site-build.yml'
  workflow_call:
  workflow_dispatch:
    inputs:
      runtime_refresh:
        description: Optional urgent runtime-package refresh generation (default UTC week)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # Release promotion consumes only the named bundles and image archives.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
jobs:
  workflow-helpers:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime-refresh: ${{ steps.refresh.outputs.generation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tests/native_cache.py
      - run: python3 tests/dependency_report.py
      - run: python3 tests/published_release.py
      - run: python3 tests/release_policy.py
      - run: python3 tests/runtime_distribution.py
      - run: python3 scripts/check-distribution.py
      - name: Choose one runtime refresh generation for this entire run
        id: refresh
        env:
          REFRESH_OVERRIDE: ${{ inputs.runtime_refresh }}
        run: |
          generation=$(python3 scripts/runtime_refresh.py --override "$REFRESH_OVERRIDE")
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
  docker:
    needs: workflow-helpers
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RUNTIME_REFRESH: ${{ needs.workflow-helpers.outputs.runtime-refresh }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up isolated build cache
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Read release version from Cargo.toml
        run: |
          version=$(python3 scripts/release_version.py)
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Test native qlog security fix with AddressSanitizer
        run: python3 tests/native_security.py
      - name: Test release packager
        run: |
          python3 tests/release_package.py
          python3 tests/release_artifacts.py
      - name: Test source engine and runtime filesystem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.build
          platforms: ${{ matrix.platform }}
          build-args: |
            NATIVE_JOBS=2
            RUNTIME_REFRESH=${{ env.RUNTIME_REFRESH }}
          target: test-minimal
          cache-from: type=gha,version=2,scope=runtime-${{ matrix.arch }}-v1
          cache-to: type=gha,version=2,scope=runtime-${{ matrix.arch }}-v1,mode=max
          # Always execute the tests, including against the exact minimal rootfs.
          no-cache-filters: test,test-minimal
      - name: Export runtime artifact
        run: docker buildx build --builder '${{ steps.buildx.outputs.name }}' -f docker/Dockerfile.build --platform ${{ matrix.platform }} --build-arg NATIVE_JOBS=2 --build-arg RUNTIME_REFRESH="$RUNTIME_REFRESH" --target runtime-artifacts --output type=local,dest=dist/runtime/${{ matrix.arch }} .
      - name: Build ready-to-run runtime image
        run: docker buildx build --builder '${{ steps.buildx.outputs.name }}' -f docker/Dockerfile.build --platform ${{ matrix.platform }} --build-arg NATIVE_JOBS=2 --build-arg RUNTIME_REFRESH="$RUNTIME_REFRESH" --build-arg SOURCE_REVISION="$GITHUB_SHA" --build-arg RELEASE_VERSION="$RELEASE_VERSION" --target runtime --load -t curlimp:runtime .
      - name: Derive distribution image without source compilation
        run: docker build --builder default --platform ${{ matrix.platform }} --build-arg RUNTIME_IMAGE=curlimp:runtime --network none -t curlimp:local .
      - name: Inspect packaged engine and profiles without network
        run: |
          docker run --rm --network none curlimp:local --version
          docker run --rm --network none curlimp:local --list-profiles
          cat dist/runtime/${{ matrix.arch }}/rootfs/opt/native/engine-build.txt
          cat dist/runtime/${{ matrix.arch }}/rootfs/opt/native/runtime-refresh.txt
          cat dist/runtime/${{ matrix.arch }}/rootfs/opt/native/runtime-packages.txt
      - name: Test final container DNS HTTPS and nonroot mounted export
        run: python3 scripts/check-runtime-container.py --image curlimp:local
      - name: Package Linux CLI and libraries
        run: |
          python3 scripts/package-release.py \
            --rootfs dist/runtime/${{ matrix.arch }}/rootfs --arch ${{ matrix.arch }} \
            --revision "$GITHUB_SHA" --output dist/release
      - name: Install native test fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 openssl curl nghttp2-server zsh procps
      - name: Test the extracted bundle directly on the native Linux runner
        run: |
          bundle="curlimp-${RELEASE_VERSION}-linux-${{ matrix.arch }}"
          install_dir="$RUNNER_TEMP/extracted bundle"
          mkdir -p "$install_dir"
          tar -xzf "dist/release/$bundle.tar.gz" -C "$install_dir"
          export CLI="$install_dir/$bundle/curlimp"
          version_output=$("$CLI" --version)
          printf '%s\n' "$version_output"
          test "$(printf '%s\n' "$version_output" | head -n 1)" = "curlimp $RELEASE_VERSION"
          REQUIRE_HTTP2=1 python3 tests/compat.py
          python3 tests/release_tls.py
          python3 tests/exports.py
          python3 tests/transfers.py
          python3 tests/completion.py
          python3 tests/zsh_completion.py
          "$CLI" -sS --fail \
            --connect-timeout 10 --max-time 30 -o /dev/null https://httpbin.org/status/200
      - name: Upload tested release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist/release/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save the tested runtime image
        run: docker save curlimp:runtime | gzip > dist/image-linux-${{ matrix.arch }}.tar.gz
      - name: Upload tested runtime image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-linux-${{ matrix.arch }}
          path: dist/image-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      RUSTUP_TOOLCHAIN: '1.90.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read release version from Cargo.toml
        run: |
          version=$(python3 scripts/release_version.py)
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Prepare Apple Silicon build and test tools
        run: |
          test "$(uname -m)" = arm64
          brew install cmake ninja go nghttp2 openssl@3
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix nghttp2)/bin" >> "$GITHUB_PATH"
      - name: Test native qlog security fix with AddressSanitizer
        run: python3 tests/native_security.py
      - name: Test macOS packager with real Mach-O fixtures
        run: python3 tests/macos_package.py
      - name: Test native header and library rebuild tracking
        run: python3 tests/build_tracking.py
      - name: Fingerprint native inputs and toolchain
        id: native-key
        run: |
          key=$(python3 scripts/native_cache.py key)
          [[ "$key" =~ ^[0-9a-f]{64}$ ]]
          echo "key=macos-native-v1-$key" >> "$GITHUB_OUTPUT"
      - name: Restore installed native engine
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/macos-build/native
          key: ${{ steps.native-key.outputs.key }}
      - name: Verify cached engine or compile from source
        env:
          NATIVE_CACHE_KEY: ${{ steps.native-key.outputs.key }}
        run: |
          prefix="$RUNNER_TEMP/macos-build/native"
          if python3 scripts/native_cache.py verify --prefix "$prefix" --key "$NATIVE_CACHE_KEY"; then
            echo 'Reusing verified native engine; CLI and tests will run from this checkout.'
          else
            rm -rf "$prefix"
            sh scripts/build-macos.sh "$RUNNER_TEMP/macos-build" 3 --engine-only
            python3 scripts/native_cache.py seal --prefix "$prefix" --key "$NATIVE_CACHE_KEY"
          fi
      - name: Check installed native features even on cache hits
        run: make -f vendor/engine/Makefile checkbuild CURL_BIN="$RUNNER_TEMP/macos-build/native/bin/curl-impersonate"
      - name: Build current Rust CLI
        env:
          CURL_IMPERSONATE_DIR: ${{ runner.temp }}/macos-build/native
          CARGO_TARGET_DIR: ${{ runner.temp }}/macos-build/target
        run: cargo build --release --locked
      - name: Test CLI parsing
        env:
          CURL_IMPERSONATE_DIR: ${{ runner.temp }}/macos-build/native
          CARGO_TARGET_DIR: ${{ runner.temp }}/macos-build/target
        run: cargo test --release --locked --lib --test cli
      - name: Package macOS Apple Silicon download
        run: |
          python3 scripts/package-macos.py \
            --binary "$RUNNER_TEMP/macos-build/target/release/curlimp" \
            --native-prefix "$RUNNER_TEMP/macos-build/native" \
            --revision "$GITHUB_SHA" --output dist/release
      - name: Test the extracted macOS bundle
        run: |
          bundle="curlimp-${RELEASE_VERSION}-macos-arm64"
          install_dir="$RUNNER_TEMP/extracted bundle"
          mkdir -p "$install_dir"
          tar -xzf "dist/release/$bundle.tar.gz" -C "$install_dir"
          export CLI="$install_dir/$bundle/curlimp"
          version_output=$("$CLI" --version)
          printf '%s\n' "$version_output"
          test "$(printf '%s\n' "$version_output" | head -n 1)" = "curlimp $RELEASE_VERSION"
          codesign --verify --strict "$CLI"
          REQUIRE_HTTP2=1 python3 tests/compat.py
          python3 tests/release_tls.py
          python3 tests/exports.py
          python3 tests/transfers.py
          python3 tests/completion.py
          python3 tests/zsh_completion.py
          "$CLI" -sS --fail \
            --connect-timeout 10 --max-time 30 -o /dev/null https://httpbin.org/status/200
      - name: Cache verified native engine after bundle tests
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/macos-build/native
          key: ${{ steps.native-key.outputs.key }}
      - name: Upload tested macOS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64
          path: dist/release/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
