name: Build documentation artifact

on:
  workflow_call:
    outputs:
      published:
        description: Whether the current version has verified published downloads
        value: ${{ jobs.build.outputs.published }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      published: ${{ steps.publication.outputs.published }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test publication gate
        working-directory: .
        run: |
          python3 tests/published_release.py
          python3 tests/release_policy.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - run: npm run check
      - name: Verify published downloads before deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: publication
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/published_release.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist
