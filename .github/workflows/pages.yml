name: Build and publish documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'Cargo.toml'
      - 'src/help.txt'
      - 'src/profiles.txt'
      - 'README.md'
      - 'docker/README.md'
      - '.github/workflows/pages.yml'
      - '.github/workflows/site-build.yml'
      - 'scripts/published_release.py'
      - 'scripts/release_policy.py'
      - 'tests/release_policy.py'
      - 'scripts/release_version.py'
      - 'tests/published_release.py'
  workflow_dispatch:
  # Releases created with GITHUB_TOKEN do not emit another release workflow run.
  workflow_run:
    workflows: ['Publish tested release']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ./.github/workflows/site-build.yml
  deploy:
    if: vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.published == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Recheck latest stable downloads immediately before deployment
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/published_release.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        if: steps.publication.outputs.published == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
