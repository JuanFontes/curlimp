name: Build and publish documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'Cargo.toml'
      - 'src/help.txt'
      - 'src/profiles.txt'
      - 'README.md'
      - 'docker/README.md'
      - '.github/workflows/pages.yml'
      - 'scripts/published_release.py'
      - 'scripts/release_policy.py'
      - 'tests/release_policy.py'
      - 'scripts/release_version.py'
      - 'tests/published_release.py'
  pull_request:
    paths:
      - 'website/**'
      - 'Cargo.toml'
      - 'src/help.txt'
      - 'src/profiles.txt'
      - 'README.md'
      - 'docker/README.md'
      - '.github/workflows/pages.yml'
      - 'scripts/published_release.py'
      - 'scripts/release_policy.py'
      - 'tests/release_policy.py'
      - 'scripts/release_version.py'
      - 'tests/published_release.py'
  workflow_dispatch:
  # Releases created with GITHUB_TOKEN do not emit another release workflow run.
  workflow_run:
    workflows: ['Publish tested release']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      published: ${{ steps.publication.outputs.published }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test publication gate
        working-directory: .
        run: |
          python3 tests/published_release.py
          python3 tests/release_policy.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - run: npm run check
      - name: Verify published downloads before deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: publication
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/published_release.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/dist
  deploy:
    if: vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.published == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Recheck latest stable downloads immediately before deployment
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/published_release.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        if: steps.publication.outputs.published == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
